<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="50%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#002B66"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#308DFF"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <circle cx="600" cy="315" r="450" fill="none" stroke="rgba(0, 122, 255, 0.15)" stroke-width="2" />
  <circle cx="600" cy="315" r="300" fill="none" stroke="rgba(0, 122, 255, 0.1)" stroke-width="1.5" />

  <!-- Lightning Bolt Icon -->
  <g transform="translate(200, 215) scale(8)" filter="url(#glow)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="url(#boltGrad)" />
  </g>

  <!-- Title Text -->
  <text x="440" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" letter-spacing="-1">FitTrainer <tspan fill="#007AFF">PRO</tspan></text>
  
  <!-- Subtitle Text -->
  <text x="445" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="rgba(255, 255, 255, 0.75)" letter-spacing="1">SOFTWARE DE GESTIÓN DE ENTRENAMIENTOS</text>

  <!-- Accent Line -->
  <rect x="445" y="415" width="550" height="4" rx="2" fill="#007AFF"/>
</svg>
